<!doctype html>
<html lang="en" class="m2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content process: content creation · SMM Reading Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* SMM Reading Map — shared styles.
   Layout: hub (modules → topics) and topic pages (road map → skim guide → tier map → tier lists → extras → notes).
   Each module owns one accent (--a). Tiers are an ordered scale of that accent:
   Tier 1 = solid accent, Tier 2 = lighter accent, Tier 3 = dashed outline. */
:root{
  --bg:#f4f6f8;
  --surface:#ffffff;
  --sunk:#eaeef2;
  --ink:#18212e;
  --muted:#556072;
  --line:#d5dbe3;
  --focus:#2f5bd3;
  --old-bg:#f6ecd9; --old-ink:#7a4d0c;
  --a:#14657d; --a-soft:#e0eff4; --a-mid:#7fb3c4; --on-a:#ffffff;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
.m1{--a:#14657d;--a-soft:#e0eff4;--a-mid:#7fb3c4}
.m2{--a:#a3305f;--a-soft:#f6e3eb;--a-mid:#d996b3}
.m3{--a:#5141b8;--a-soft:#e9e6f8;--a-mid:#a79ee0}
.m4{--a:#a9501a;--a-soft:#f8e8dc;--a-mid:#e0a57f}
.m5{--a:#2f6b3e;--a-soft:#e2efe5;--a-mid:#8fbf9b}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1319; --surface:#161c24; --sunk:#1d242e; --ink:#e6eaf0; --muted:#9aa5b5; --line:#2a3340;
    --focus:#8aa8ff; --old-bg:#3a2c12; --old-ink:#e9c07a; --on-a:#0f1319; color-scheme:dark;
  }
  :root:not([data-theme="light"]) .m1,:root.m1:not([data-theme="light"]){--a:#62b6d2;--a-soft:#13303a;--a-mid:#2f6f84}
  :root:not([data-theme="light"]) .m2,:root.m2:not([data-theme="light"]){--a:#e886ae;--a-soft:#3a1a28;--a-mid:#8a3f60}
  :root:not([data-theme="light"]) .m3,:root.m3:not([data-theme="light"]){--a:#a99ef2;--a-soft:#24203f;--a-mid:#5a4fa0}
  :root:not([data-theme="light"]) .m4,:root.m4:not([data-theme="light"]){--a:#f0a46e;--a-soft:#3a2516;--a-mid:#8f5a33}
  :root:not([data-theme="light"]) .m5,:root.m5:not([data-theme="light"]){--a:#7cc68f;--a-soft:#18301e;--a-mid:#3f7a4e}
}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#161c24; --sunk:#1d242e; --ink:#e6eaf0; --muted:#9aa5b5; --line:#2a3340;
  --focus:#8aa8ff; --old-bg:#3a2c12; --old-ink:#e9c07a; --on-a:#0f1319; color-scheme:dark;
}
:root[data-theme="dark"] .m1,:root.m1[data-theme="dark"]{--a:#62b6d2;--a-soft:#13303a;--a-mid:#2f6f84}
:root[data-theme="dark"] .m2,:root.m2[data-theme="dark"]{--a:#e886ae;--a-soft:#3a1a28;--a-mid:#8a3f60}
:root[data-theme="dark"] .m3,:root.m3[data-theme="dark"]{--a:#a99ef2;--a-soft:#24203f;--a-mid:#5a4fa0}
:root[data-theme="dark"] .m4,:root.m4[data-theme="dark"]{--a:#f0a46e;--a-soft:#3a2516;--a-mid:#8f5a33}
:root[data-theme="dark"] .m5,:root.m5[data-theme="dark"]{--a:#7cc68f;--a-soft:#18301e;--a-mid:#3f7a4e}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.6}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1140px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:clamp(1.55rem,1.2rem + 1.4vw,2.1rem);font-weight:700;letter-spacing:-0.01em}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ref{font-family:var(--mono);font-size:.8rem;white-space:nowrap;padding:.08em .45em;border-radius:4px;background:var(--sunk);color:var(--ink);font-variant-numeric:tabular-nums}
.ref.acc{background:var(--a-soft);color:var(--a)}
.muted{color:var(--muted)}

/* ---------- Tier marks (shared) ---------- */
.tierchip{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:.12em .5em;border-radius:4px;white-space:nowrap;line-height:1.5}
.tierchip.t1{background:var(--a);color:var(--on-a)}
.tierchip.t2{background:var(--a-soft);color:var(--a);box-shadow:inset 0 0 0 1px var(--a-mid)}
.tierchip.t3{background:transparent;color:var(--a);box-shadow:none;outline:1px dashed var(--a);outline-offset:-1px}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:6px 14px;padding-block:8px;flex-wrap:wrap}
.topbar .home{font-size:.9rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.topbar .home::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--a)}
.topbar .crumb{font-size:.88rem;color:var(--muted)}
.topbar .jump{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;flex:1 1 320px;min-width:0}
.topbar .jump a:first-child{margin-left:auto}
.topbar .jump a{flex:none;text-decoration:none;font-size:.86rem;padding:.3em .7em;border-radius:999px;color:var(--muted);border:1px solid transparent}
.topbar .jump a:hover{color:var(--ink);border-color:var(--line)}
@media (max-width:760px){.topbar .jump{flex-basis:100%}.topbar .jump a:first-child{margin-left:0}}
/* reading progress strip, inside the sticky top bar */
.readbar{border-top:1px solid var(--line)}
.topbar .readbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-block:7px}
.rb-total{display:flex;align-items:baseline;gap:8px;flex:none}
.rb-pct{font-family:var(--mono);font-size:.98rem;font-weight:500;color:var(--a);min-width:4ch}
.rb-lab{font-size:.82rem;color:var(--muted);white-space:nowrap}
.rb-track{flex:1 1 64px;min-width:64px;display:flex;gap:4px;height:9px}
.rb-seg{display:block;position:relative;height:100%;min-width:12px;border-radius:999px;background:var(--sunk);overflow:hidden}
.rb-seg i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit;transition:width .35s ease}
.rb-seg.s1 i{background:var(--a)}
.rb-seg.s2 i{background:var(--a-mid)}
.rb-seg.s3 i{background:repeating-linear-gradient(135deg,var(--a) 0 3px,transparent 3px 6px)}
.rb-tiers{display:flex;align-items:center;gap:12px;flex:none}
.rb-t{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink);font-family:var(--mono);font-size:.8rem;border-radius:6px;padding:2px 3px}
.rb-t:hover{background:var(--a-soft)}
.rb-t .tierchip{font-size:.66rem;padding:.05em .42em}
.rb-n{min-width:4ch}
.rb-t.full .rb-n::after{content:" \2713";color:var(--a)}
.rb-skim{font-size:.8rem;color:var(--muted);padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}
.readbar.complete .rb-lab{color:var(--a);font-weight:700}
@media (max-width:980px){.rb-skim{display:none}}
@media (max-width:760px){.rb-lab{display:none}.topbar .readbar .wrap{gap:6px 10px;padding-block:6px}.rb-tiers{gap:6px}.rb-t{font-size:.74rem}}
@media (prefers-reduced-motion:reduce){.rb-seg i{transition:none}}
section.block{scroll-margin-top:calc(var(--tbh,50px) - 40px)}

/* ---------- Topic hero ---------- */
header.hero{padding-block:40px 26px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--a-soft),var(--bg) 70%)}
.hero .eyebrow{color:var(--a)}
.hero h1{font-size:clamp(2.2rem,1.5rem + 3.2vw,3.6rem);font-weight:700;letter-spacing:-0.02em;margin-top:10px}
.hero .lede{max-width:66ch;margin-top:14px;font-size:1.08rem}
.hero .cp{max-width:76ch;margin-top:12px;font-size:.95rem;color:var(--muted)}
.hero .cp b{color:var(--ink)}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px}
.legend .tier{background:var(--surface);padding:14px 16px 16px;border-radius:0 0 8px 8px;min-width:0;border-top:4px solid var(--a)}
.legend .tier.l2{border-top-color:var(--a-mid)}
.legend .tier.l3{border-top:4px dashed var(--a)}
.legend .tier b{font-family:var(--display);font-size:1.08rem;display:block;margin-top:4px}
.legend .tier p{font-size:.95rem;color:var(--muted);margin-top:4px}
@media (max-width:760px){.legend{grid-template-columns:1fr}}
.pager{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.pager a,.pager span{font-size:.9rem;padding:.4em .85em;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.pager span{color:var(--muted);border-style:dashed;background:transparent}

section.block{padding-block:48px 8px}
section.block > .wrap > header{display:grid;gap:8px;margin-bottom:22px}
section.block > .wrap > header p{max-width:70ch;color:var(--muted)}

/* ---------- Road map (stops) ---------- */
ol.route{list-style:none;margin:0;padding:0;display:grid;gap:18px;position:relative}
ol.route::before{content:"";position:absolute;left:21px;top:18px;bottom:18px;width:3px;background:var(--a);opacity:.35;border-radius:2px}
.stop{display:grid;grid-template-columns:46px minmax(0,1fr);gap:16px;align-items:start}
.stop .dot{width:44px;height:44px;border-radius:50%;background:var(--surface);border:3px solid var(--a);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--a);position:relative;z-index:1}
.stop .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.stop .card h3{font-size:1.3rem}
.stop .plain{margin-top:6px;max-width:70ch}
.stop .cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;margin-top:14px}
@media (max-width:820px){.stop .cols{grid-template-columns:1fr}}
.stop ul.learn{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.stop ul.learn li{padding-left:16px;position:relative}
.stop ul.learn li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--a)}
.stop .side{display:grid;gap:12px;align-content:start}
.stop .side .box{background:var(--sunk);border-radius:8px;padding:12px 14px}
.stop .side .box .eyebrow{font-size:.7rem}
.stop .side .box p{margin-top:4px;font-size:.95rem}
.tiercount{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.linkrow{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
button.linkish{background:none;border:0;padding:0;color:var(--a);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.9rem}

.plan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:26px}
.plan .s{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--a);border-radius:8px;padding:12px 14px;min-width:0}
.plan .s.p2{border-left-color:var(--a-mid)} .plan .s.p3{border-left:4px dashed var(--a)}
.plan .s p{font-size:.95rem;margin-top:4px}
@media (max-width:900px){.plan{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.plan{grid-template-columns:1fr}}

/* ---------- Skim guide ---------- */
.skimkey{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:.92rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.skimkey span{display:inline-flex;align-items:center;gap:8px;min-width:0}
.act{display:inline-block;font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:.2em .55em;border-radius:4px;white-space:nowrap;text-align:center;min-width:62px}
.act.read{background:var(--a);color:var(--on-a)}
.act.skim{box-shadow:inset 0 0 0 1.5px var(--a);color:var(--a)}
.act.glance{background:var(--sunk);color:var(--ink)}
.act.skip{outline:1.5px dashed var(--line);outline-offset:-1.5px;color:var(--muted)}
.fast{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:.15em .5em;border-radius:999px;background:var(--a-soft);color:var(--a);white-space:nowrap}
.fast::before{content:"\2605  "}
.skimbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-size:.93rem;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.45em .9em;border-radius:8px;text-align:left}
.seg button[aria-pressed="true"]{background:var(--a);color:var(--on-a);border-color:var(--a)}
.fasttoggle{display:inline-flex;align-items:center;gap:8px;font-size:.93rem;cursor:pointer}
.fasttoggle input{width:18px;height:18px;accent-color:var(--a)}
.skimsum{margin-top:10px;font-size:.92rem;color:var(--muted)}
.filterbanner{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--a-soft);color:var(--ink);font-size:.93rem}
.filterbanner b{color:var(--a)}
.booklabel{font-family:var(--display);font-weight:700;font-size:1.02rem;margin:20px 0 4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.booklabel small{font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted)}
.skimrow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.skimrow:first-child{border-top:3px solid var(--a);margin-top:12px}
.skimrow .pn{display:grid;gap:8px;align-content:start}
.skimrow .pn b{font-family:var(--mono);font-weight:500;font-size:1.05rem;color:var(--a);font-variant-numeric:tabular-nums;white-space:nowrap}
.skimrow .pn label{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);cursor:pointer}
.skimrow .pn input{width:16px;height:16px;accent-color:var(--a)}
.skimrow h4{font-size:1.08rem;font-weight:700;line-height:1.25}
.skimrow ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px}
.skimrow li{display:grid;grid-template-columns:20px 72px minmax(0,1fr);gap:12px;align-items:start}
.skimrow li .pt{width:17px;height:17px;margin:3px 0 0;accent-color:var(--a);cursor:pointer}
.skimrow li .pt-none{color:var(--muted);text-align:center;line-height:1.6;opacity:.6}
.skimrow li.pdone > div,.skimrow li.pdone .act{opacity:.5}
.skimrow li.pdone .what{text-decoration:line-through;text-decoration-color:var(--a-mid);text-decoration-thickness:1.5px}
.skimrow .pn .pg-skip{font-size:.75rem;color:var(--muted)}
.skimrow li .act{margin-top:2px}
.skimrow li .what{font-size:.97rem}
.skimrow li .take{margin-top:3px;font-size:.93rem;color:var(--muted)}
.skimrow li .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag-deck,.tag-old,.tag-stop{font-size:.78rem;padding:.1em .5em;border-radius:4px;line-height:1.5}
.tag-deck{background:var(--sunk);color:var(--ink)}
.tag-old{background:var(--old-bg);color:var(--old-ink)}
.tag-stop{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.skimrow.donepage h4{opacity:.55}
.skimrow.donepage .pn b::after{content:" \2713";font-size:.9em}
.skimnote{margin-top:14px;max-width:80ch;font-size:.95rem;color:var(--muted)}
@media (max-width:560px){
  .skimrow{grid-template-columns:1fr;gap:6px}
  .skimrow .pn{grid-auto-flow:column;justify-content:space-between;align-items:center}
  .skimrow li{grid-template-columns:22px minmax(0,1fr);gap:4px 10px}
  .skimrow li .act{justify-self:start;grid-column:2}
  .skimrow li > div{grid-column:2}
}

/* ---------- Tier map ---------- */
.topicbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.topicbar button{font-size:.9rem;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.4em .85em;border-radius:999px}
.topicbar button[aria-pressed="true"]{background:var(--a);color:var(--on-a);border-color:var(--a)}
.topicbar button:hover{border-color:var(--a)}
.topicbar .go-skim{opacity:.6;font-size:.85em}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.mapgrid > *{min-width:0}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto;max-width:100%}
.mapbox svg{display:block;width:100%;height:auto}
@media (max-width:700px){.mapbox svg{width:880px;max-width:none}}
.maphint{font-size:.88rem;color:var(--muted);margin:8px 4px 0}
.mapkey{display:flex;flex-wrap:wrap;gap:16px;font-size:.88rem;color:var(--muted);margin-top:10px}
.mapkey span{display:inline-flex;align-items:center;gap:8px}
.mapkey svg{flex:none}
svg .ring{fill:none}
svg .ring.r1{stroke:var(--a);stroke-width:2}
svg .ring.r2{stroke:var(--a-mid);stroke-width:2;stroke-dasharray:8 7}
svg .ring.r3{stroke:var(--a-mid);stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round}
svg .ringlabel{font-family:var(--mono);font-size:13px;letter-spacing:.08em;font-weight:500;fill:var(--a)}
svg .spoke{stroke:var(--line);stroke-width:2}
svg .flow{fill:none;stroke:var(--muted);stroke-width:2.2}
svg .loop{fill:none;stroke:var(--a);stroke-width:2.6}
svg .cross{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 5;opacity:.75}
svg .arrowhead{fill:var(--muted)} svg .arrowhead.acc{fill:var(--a)}
svg .centre{fill:var(--a)}
svg .centretext{fill:var(--on-a);font-family:var(--display);font-weight:700;font-size:16px}
svg .tnode circle{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
svg .tnode .num{fill:var(--a);font-family:var(--display);font-weight:700;font-size:15px}
svg .tnode .lab{fill:var(--ink);font-family:var(--display);font-weight:700;font-size:14px}
svg .tnode{cursor:pointer}
svg .tnode:focus{outline:none}
svg .tnode:focus-visible circle{stroke:var(--focus);stroke-width:4}
svg .tnode.sel circle{fill:var(--a);stroke:var(--a)}
svg .tnode.sel .lab,svg .tnode.sel .num{fill:var(--on-a)}
svg .sat rect{fill:var(--surface)}
svg .sat.s1 rect{stroke:var(--a);stroke-width:2.2;fill:var(--a-soft)}
svg .sat.s2 rect{stroke:var(--a-mid);stroke-width:2}
svg .sat.s3 rect{stroke:var(--a);stroke-width:1.4;stroke-dasharray:5 4}
svg .sat .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;fill:var(--a)}
svg .sat .txt{fill:var(--ink);font-family:var(--body);font-size:13px}
svg .sat{cursor:pointer}
svg .sat:focus{outline:none}
svg .sat:focus-visible rect{stroke:var(--focus);stroke-width:3}
svg .sat:hover rect{stroke-width:3}
svg .spokegroup{transition:opacity .2s}
svg .dim{opacity:.3}
svg .crosssel{opacity:1;stroke:var(--ink);stroke-width:2.2}
@media (prefers-reduced-motion:reduce){svg .spokegroup{transition:none}}

.detail{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--a);border-radius:12px;padding:18px 18px 20px;min-width:0}
.detail h3{font-size:1.35rem;margin-top:4px}
.detail .plain{margin-top:6px;color:var(--muted)}
.detail .go{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* Module glossary widget: a row of letter circles in the module colour.
   Tapping a letter opens that letter's terms, each with a short meaning, its source,
   and links to the topic page and stop where it is taught.
   Needs window.CATALOG, window.GLOSSARY and window.STOPNAMES (added by build.py). */
window.SMMGlossary = (function(){
"use strict";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function letterOf(t){ var c=t.replace(/^[^A-Za-z0-9]+/,"").charAt(0).toUpperCase(); return /[A-Z]/.test(c)?c:"#"; }
var LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
function sessionOf(file){
  var C=window.CATALOG, s="";
  C.modules.forEach(function(m){ m.topics.forEach(function(t){ if(t.file===file+".html") s=t.s; }); });
  return s;
}
function linkFor(at,current){
  var file=at[0], stop=at[1], names=(window.STOPNAMES||{})[file]||{};
  var href=(current===file?"":file+".html")+"#stop-"+stop;
  var label=sessionOf(file)+" · "+(names[stop]||("Stop "+stop));
  return '<a class="gl-go" href="'+href+'">'+esc(label)+' <span aria-hidden="true">→</span></a>';
}
function render(box,mod,current,opts){
  opts=opts||{};
  var terms=((window.GLOSSARY||{})[mod.id]||[]).slice().sort(function(a,b){ return a.t.toLowerCase().localeCompare(b.t.toLowerCase()); });
  var uid="gl-"+mod.id+"-"+Math.random().toString(36).slice(2,7);
  if(!terms.length){
    box.innerHTML='<div class="gloss empty-gl"><div class="gl-head"><h3>Module '+mod.n+' glossary</h3></div><p class="muted">Terms will be added here as this module\'s topic pages are written.</p></div>';
    return;
  }
  var by={}; terms.forEach(function(t){ var L=letterOf(t.t); (by[L]=by[L]||[]).push(t); });
  var letters=LETTERS.map(function(L){
    var n=(by[L]||[]).length;
    return '<button type="button" class="gl-l" data-l="'+L+'"'+(n?' aria-expanded="false" aria-controls="'+uid+'-panel" title="'+n+' term'+(n>1?'s':'')+'"':' disabled title="No terms"')+'>'+L+'</button>';
  }).join("");
  box.innerHTML='<div class="gloss">'+
    '<div class="gl-head">'+(opts.noTitle?'':'<h3>Module '+mod.n+' glossary</h3>')+'<span class="gl-count">'+terms.length+' terms</span>'+
    '<button type="button" class="linkish gl-all" aria-expanded="false" aria-controls="'+uid+'-panel">Show all terms</button></div>'+
    (opts.noTitle?'':'<p class="gl-hint">Tap a letter to see its terms. Each term links to the topic and stop where it is taught.</p>')+
    '<div class="gl-letters" role="group" aria-label="Glossary letters">'+letters+'</div>'+
    '<div class="gl-panel" id="'+uid+'-panel" role="region" aria-live="polite" hidden></div></div>';
  var panel=box.querySelector(".gl-panel"), open=null;
  function itemHTML(t){
    var links=[], seen={};
    t.at.forEach(function(a){ var k=a[0]+"#"+a[1]; if(!seen[k]){ seen[k]=1; links.push(linkFor(a,current)); } });
    return '<div class="gl-item" data-term="'+esc(t.t)+'"><dt>'+esc(t.t)+'</dt><dd><p>'+esc(t.d)+'</p><div class="gl-meta"><span class="ref">'+esc(t.src)+'</span>'+
      '<span class="gl-links"><span class="gl-rm">Read more:</span> '+links.join(" ")+'</span>'+(opts.ask?'<button class="ask-mini" type="button" data-ask="term" data-id="'+esc(t.t)+'">Ask</button>':'')+'</div></dd></div>';
  }
  function show(L){
    open=L;
    Array.prototype.forEach.call(box.querySelectorAll(".gl-l"),function(b){ if(!b.disabled) b.setAttribute("aria-expanded",String(b.getAttribute("data-l")===L)); });
    box.querySelector(".gl-all").setAttribute("aria-expanded",String(L==="*"));
    box.querySelector(".gl-all").textContent=L==="*"?"Hide all terms":"Show all terms";
    if(!L){ panel.hidden=true; panel.innerHTML=""; return; }
    var html="";
    if(L==="*"){
      LETTERS.forEach(function(x){ if(by[x]) html+='<div class="gl-group"><div class="gl-big" aria-hidden="true">'+x+'</div><dl>'+by[x].map(itemHTML).join("")+'</dl></div>'; });
    } else {
      html='<div class="gl-group"><div class="gl-big" aria-hidden="true">'+L+'</div><dl>'+by[L].map(itemHTML).join("")+'</dl></div>';
    }
    panel.innerHTML='<div class="gl-panelhead"><b>'+(L==="*"?"All "+terms.length+" terms":L+" · "+by[L].length+" term"+(by[L].length>1?"s":""))+'</b><button type="button" class="linkish gl-close">Close</button></div>'+html;
    panel.hidden=false;
  }
  box.addEventListener("click",function(e){
    var b=e.target.closest(".gl-l,.gl-all,.gl-close"); if(!b || b.disabled) return;
    if(b.classList.contains("gl-close")){ var was=open; show(null); var f=box.querySelector(was==="*"?".gl-all":'.gl-l[data-l="'+was+'"]'); if(f) f.focus(); return; }
    var L=b.classList.contains("gl-all")?"*":b.getAttribute("data-l");
    show(open===L?null:L);
  });
}
return {render:render};
})();

<script>
/* Topic page renderer. Needs window.CATALOG and window.TOPIC. */
(function(){
"use strict";
var T=window.TOPIC, C=window.CATALOG;
var STOPS=T.stops, R=T.readings, N=STOPS.length;
var MOD=C.modules.filter(function(m){return m.id===T.module;})[0];
var KEY="smm-rm-"+T.id;

/* ---------- helpers ---------- */
function el(tag,attrs,html){var e=document.createElement(tag); if(attrs){for(var k in attrs){ if(k==="class") e.className=attrs[k]; else e.setAttribute(k,attrs[k]); }} if(html!=null) e.innerHTML=html; return e;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function stop(id){for(var i=0;i<N;i++) if(STOPS[i].id===id) return STOPS[i];}
function byTier(t){return R.filter(function(r){return r.tier===t;});}
function smooth(){ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"; }catch(e){ return "auto"; } }
function go(id){ var t=document.getElementById(id); if(t) t.scrollIntoView({behavior:smooth(),block:"start"}); }
var done={};
try{ done=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ done={}; }
function saveDone(){ try{ localStorage.setItem(KEY,JSON.stringify(done)); }catch(e){} syncAll(); }
var TIERNAME=["Tier 1 · Primary","Tier 2 · Adjacent","Tier 3 · Outside the syllabus"];
var ACT={read:"Read",skim:"Skim",glance:"Glance",skip:"Skip"};
var MIN={read:2,skim:1,glance:0.5,skip:0};

var app=document.getElementById("app");
document.title=T.title+" · SMM Reading Map";

/* ---------- top bar ---------- */
var ready=MOD.topics.filter(function(t){return t.file;});
var idx=MOD.topics.map(function(t){return t.file;}).indexOf(T.file);
var topicNo=idx+1;
var jumps=[["route","Road map"],["skim","Skim guide"],["map","Tier map"],["tier1","Tier 1"],["tier2","Tier 2"],["tier3","Tier 3"]];
(T.extras||[]).forEach(function(x){jumps.push([x.id,x.nav||x.title]);});
if(window.GLOSSARY && (window.GLOSSARY[T.module]||[]).length) jumps.push(["glossary","Glossary"]);
else jumps.push(["notes","Notes"]);
var top=el("nav",{class:"topbar","aria-label":"Page"});
top.innerHTML='<div class="wrap"><a class="home" href="index.html#'+MOD.id+'">SMM Reading Map</a><span class="crumb" title="Topic '+topicNo+' of '+MOD.topics.length+' in Module '+MOD.n+'">Module '+MOD.n+' · '+topicNo+' of '+MOD.topics.length+'</span><div class="jump">'+
  jumps.map(function(j){return '<a href="#'+j[0]+'">'+esc(j[1])+'</a>';}).join("")+'</div></div>';
app.appendChild(top);

/* ---------- reading progress: a strip inside the sticky top bar ----------
   The bar is split into Tier 1, 2 and 3, each as wide as its share of the reading list,
   and each fills as its items are ticked. Skim-guide pages are counted separately. */
var TCOUNT=[1,2,3].map(function(n){return byTier(n).length;});
var rb=el("div",{class:"readbar",role:"group","aria-label":"Reading progress"});
rb.innerHTML='<div class="wrap">'+
  '<div class="rb-total"><b class="rb-pct" aria-live="polite">0%</b><span class="rb-lab"></span></div>'+
  '<div class="rb-track" aria-hidden="true">'+[1,2,3].map(function(n){
     return TCOUNT[n-1]?'<a class="rb-seg s'+n+'" href="#tier'+n+'" tabindex="-1" style="flex-grow:'+TCOUNT[n-1]+'"><i></i></a>':'';
   }).join("")+'</div>'+
  '<div class="rb-tiers">'+[1,2,3].map(function(n){
     return '<a class="rb-t" href="#tier'+n+'"><span class="tierchip t'+n+'">T'+n+'</span><span class="rb-n">0%</span></a>';
   }).join("")+'<span class="rb-skim"></span></div>'+
 '</div>';
top.appendChild(rb);
function fmtPct(v){ return (v>0 && v<1) ? "<1%" : Math.floor(v+1e-9)+"%"; }
function credit(r){ var c=COVER[r.id]; if(!c) return done[r.id]?1:0; var t=partsTotal(r); return t?partsTicked(r)/t:(isRead(r)?1:0); }
function updateReadbar(){
  if(!rb) return;
  /* a reading linked to skim pages earns part credit as its pages are ticked, so every skim tick moves the bar */
  var tot=0, dn=0, cr=0, pt=0, tiers=rb.querySelectorAll(".rb-t");
  [1,2,3].forEach(function(n){
    var all=byTier(n), d=all.filter(isRead).length, part=all.filter(function(r){return !isRead(r) && partsTicked(r)>0;}).length;
    var c=all.reduce(function(s,r){return s+credit(r);},0);
    tot+=all.length; dn+=d; cr+=c; pt+=part;
    var pv=all.length?c*100/all.length:0, p=fmtPct(pv);
    var seg=rb.querySelector(".rb-seg.s"+n); if(seg) seg.firstChild.style.width=(all.length?c*100/all.length:0)+"%";
    var t=tiers[n-1], txt=d+" of "+all.length+" read"+(part?", "+part+" part-read":"");

<script>
/* "Ask a doubt" on topic pages.
   Point at something (a stop, a skim page, a reading, a glossary term, or any text you select),
   type the doubt, and send it to Claude with that part of the guide attached as context.
   - Everywhere: "Open in Claude" starts a new Claude chat with the doubt filled in (and copies it).
   - Inside the Claude-hosted version, when the page may use Claude: "Ask here" answers in the panel.
   Doubts are saved in this browser so they can be revisited. Needs window.TOPIC, window.CATALOG. */
(function(){
"use strict";
var T=window.TOPIC, C=window.CATALOG; if(!T) return;
var MOD=C.modules.filter(function(m){return m.id===T.module;})[0];
var LOGKEY="smm-rm-ask-"+T.id, PROJKEY="smm-rm-ask-project";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function el(tag,attrs,html){var e=document.createElement(tag); if(attrs){for(var k in attrs){ if(k==="class") e.className=attrs[k]; else e.setAttribute(k,attrs[k]); }} if(html!=null) e.innerHTML=html; return e;}
function load(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)||"null"); return v==null?d:v; }catch(e){ return d; } }
function store(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function clip(s,n){ s=String(s).replace(/\s+/g," ").trim(); return s.length>n?s.slice(0,n-1)+"…":s; }

/* ---------- what each kind of pointer tells Claude ---------- */
function stopById(id){ return T.stops.filter(function(s){return s.id===Number(id);})[0]; }
function ctxTopic(){
  return {label:"The whole topic", lines:[T.lede.replace(/<[^>]+>/g,""), "Stops: "+T.stops.map(function(s){return s.id+". "+s.name;}).join("; ")]};
}
function ctxStop(id){
  var s=stopById(id); if(!s) return ctxTopic();
  return {label:"Stop "+s.id+" · "+s.name, lines:[s.plain].concat(s.learn.map(function(l){return l[0]+(l[1] && l[0].indexOf(l[1])<0?" ("+l[1]+")":"");})).concat(["Likely exam question: "+s.ask])};
}
function ctxSkim(key){
  var found=null;
  (T.skim||[]).forEach(function(B){ B.pages.forEach(function(pg){ if("skim-"+B.key+"-"+pg.p===key) found={B:B,pg:pg}; }); });
  if(!found) return ctxTopic();
  var B=found.B, pg=found.pg, book=(B.label||"").split(" · ")[0];
  var ACT={read:"Read",skim:"Skim",glance:"Glance",skip:"Skip"};
  return {label:"Skim guide · "+book+" · "+(pg.pl||"p. "+pg.p)+" · "+pg.h,
          lines:pg.b.map(function(b){return ACT[b.a]+": "+b.w+(b.t?" — "+b.t:"");}).concat([B.note||""])};
}
function ctxReading(id){
  var r=T.readings.filter(function(x){return x.id===id;})[0]; if(!r) return ctxTopic();
  if(r.tier===3) return {label:"Tier 3 reading · "+r.title, lines:[r.src+", "+r.date, r.why, r.url||""]};
  var b=T.books[r.book]||{};
  return {label:"Tier "+r.tier+" reading · "+(b.short||"")+" · "+r.where+" · "+r.pages, lines:[r.title, r.why, (b.label||"")+(r.unv?" (page numbers not checked)":"")]};
}
function ctxTerm(name){
  var t=((window.GLOSSARY||{})[T.module]||[]).filter(function(x){return x.t===name;})[0];
  if(!t) return ctxTopic();
  return {label:"Glossary · "+t.t, lines:[t.d, "Source: "+t.src]};
}
function ctxSection(sec){
  var h=sec.querySelector("h2"), ey=sec.querySelector(".eyebrow");
  return {label:(ey?ey.textContent+" · ":"")+(h?h.textContent:"This section"), lines:[]};
}
function ctxFromNode(node){
  if(!node || !node.closest) return ctxTopic();
  var n;
  if((n=node.closest(".stop"))) return ctxStop(n.id.replace("stop-",""));
  if((n=node.closest(".skimrow"))) return ctxSkim(n.getAttribute("data-key"));
  if((n=node.closest("ul.items li[data-rid]"))) return ctxReading(n.getAttribute("data-rid"));
  if((n=node.closest(".gl-item[data-term]"))) return ctxTerm(n.getAttribute("data-term"));
  if((n=node.closest(".detail"))){ var sel=document.querySelector('.topicbar button[aria-pressed="true"]'); if(sel) return ctxStop(sel.getAttribute("data-stop")); }
  if((n=node.closest("section.block"))) return ctxSection(n);
  return ctxTopic();
}

/* ---------- the message sent to Claude ---------- */
function buildPrompt(ctx,quote,q,short){
  var lineCap=short?180:400, maxLines=short?5:14;
  var lines=ctx.lines.filter(Boolean).slice(0,maxLines).map(function(l){return "- "+clip(l,lineCap);});
  var parts=[
    "I teach 22MDM32 Social Media Marketing (MBA) and I'm preparing this topic from my reading guide.",
    "Topic: "+T.session+" · "+T.title+" (Module "+MOD.n+": "+MOD.title+")",
    "Where I'm reading: "+ctx.label
  ];
  if(lines.length) parts.push("What my guide says there:\n"+lines.join("\n"));
  if(quote) parts.push("The text I selected:\n“"+clip(quote,short?400:1200)+"”");
  parts.push("My doubt: "+(q||"(please explain this part)"));
  parts.push("Please answer in simple, plain language. If the answer is in the book pages listed above, point me to the page, but don't invent page numbers. Give an Indian example if it helps.");
  return parts.join("\n\n");
}
function claudeUrl(prompt){ return "https://claude.ai/new?q="+encodeURIComponent(prompt); }
function urlPrompt(ctx,quote,q){
  var p=buildPrompt(ctx,quote,q,false); if(p.length<=1800) return p;
  p=buildPrompt(ctx,quote,q,true); return p.length<=1800?p:p.slice(0,1790)+"…";
}

/* ---------- copying ---------- */
function copyText(s){
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(s).then(function(){return true;},function(){ return legacyCopy(s); }); }
  return Promise.resolve(legacyCopy(s));
}
function legacyCopy(s){
  var ta=el("textarea",{"aria-hidden":"true",style:"position:fixed;left:-9999px;top:0"}); ta.value=s; document.body.appendChild(ta); ta.select();
  var ok=false; try{ ok=document.execCommand("copy"); }catch(e){ ok=false; } ta.remove(); return ok;
}

/* ---------- a little Markdown for Claude's answers (escaped first) ---------- */
function md(src){
  var out=[], list=null;
  esc(src).split(/\n/).forEach(function(line){
    var b=line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    var h=line.match(/^\s*#{1,4}\s+(.*)$/);
    function inline(t){ return t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>"); }
    if(b){ if(!list){ list=[]; } list.push("<li>"+inline(b[1])+"</li>"); return; }
    if(list){ out.push("<ul>"+list.join("")+"</ul>"); list=null; }
    if(h) out.push("<p><b>"+inline(h[1])+"</b></p>");
    else if(line.trim()) out.push("<p>"+inline(line)+"</p>");
  });
  if(list) out.push("<ul>"+list.join("")+"</ul>");
  return out.join("");
}

document.body.appendChild(fab);
var panel=el("div",{class:"ask-panel",role:"dialog","aria-modal":"false","aria-labelledby":"ask-title"});
panel.hidden=true;
panel.innerHTML=
 '<div class="ask-top"><h2 id="ask-title">Ask a doubt</h2><button type="button" class="ask-x" aria-label="Close">×</button></div>'+
 '<div class="ask-body">'+
  '<div class="ask-ctx"><div class="ask-ctx-l"><span class="eyebrow">About</span><b class="ask-where"></b></div><button type="button" class="linkish ask-widen">Ask about the whole topic</button></div>'+
  '<blockquote class="ask-quote" hidden></blockquote>'+
  '<label class="ask-lab" for="ask-q">Your doubt</label>'+
  '<textarea id="ask-q" rows="4" placeholder="Type your doubt. For example: what is the difference between these two ideas, and which one matters more?"></textarea>'+
  '<div class="ask-chips" role="group" aria-label="Quick prompts">'+
   ['Explain this in simple words','Give me an Indian example','How do I explain this in class?','What could the exam ask, with a model answer?','How is this different from a related idea?'].map(function(c){return '<button type="button" class="ask-chip">'+c+'</button>';}).join("")+
  '</div>'+
  '<div class="ask-actions">'+
   '<button type="button" class="ask-btn primary ask-here" hidden>Ask here</button>'+
   '<a class="ask-btn ask-open" target="_blank" rel="noopener" href="https://claude.ai/new">Open in Claude ↗</a>'+
   '<a class="ask-btn ask-proj" target="_blank" rel="noopener" href="#" hidden>Open in my project ↗</a>'+
   '<button type="button" class="ask-btn ask-copy">Copy</button>'+
  '</div>'+
  '<p class="ask-status" aria-live="polite"></p>'+
  '<div class="ask-answer" hidden><div class="ask-ans-head"><span class="eyebrow">Claude’s answer</span><button type="button" class="linkish ask-stop" hidden>Stop</button></div><div class="ask-thread"></div>'+
   '<div class="ask-follow"><textarea rows="2" placeholder="Ask a follow-up…" aria-label="Follow-up question"></textarea><button type="button" class="ask-btn primary ask-send">Send</button></div></div>'+
  '<details class="ask-help"><summary>How this works</summary>'+
   '<p><b>Open in Claude</b> starts a new Claude chat with your doubt and this part of the guide already filled in. It also copies the same text, in case the chat opens empty: then just paste.</p>'+
   '<p><b>For answers from your own book copies</b>, ask inside your Claude project that holds the books: paste your project’s link below once, and an <b>Open in my project</b> button appears. It copies the doubt and opens the project; paste it there.</p>'+
   '<div class="ask-projset"><input type="url" placeholder="https://claude.ai/project/…" aria-label="Your Claude project link"><button type="button" class="ask-btn ask-projsave">Save link</button></div>'+
   '<p class="ask-heretip" hidden><b>Ask here</b> answers inside this page using your Claude account. The first time, Claude asks you to allow it. It sees only what this page sends, not your books.</p>'+
  '</details>'+
  '<details class="ask-log"><summary>Your earlier doubts on this page <span class="ask-logn"></span></summary><ul></ul></details>'+
 '</div>';
document.body.appendChild(panel);

var $=function(sel){return panel.querySelector(sel);};
var qBox=$("#ask-q"), whereEl=$(".ask-where"), quoteEl=$(".ask-quote"), status=$(".ask-status");
var openA=$(".ask-open"), projA=$(".ask-proj"), hereBtn=$(".ask-here"), answer=$(".ask-answer"), thread=$(".ask-thread"), stopBtn=$(".ask-stop");
var cur={ctx:ctxTopic(),quote:null}, opener=null, sample=null, turns=[], ctl=null;

function refreshLinks(){
  var p=urlPrompt(cur.ctx,cur.quote,qBox.value.trim());
  openA.href=claudeUrl(p);
  var proj=load(PROJKEY,"");
  projA.hidden=!proj; if(proj) projA.href=proj;
}
function openAsk(ctx,quote,from){
  cur={ctx:ctx||ctxTopic(),quote:quote||null};
  opener=from||document.activeElement;
  whereEl.textContent=cur.ctx.label;
  $(".ask-widen").hidden=cur.ctx.label==="The whole topic" && !cur.quote;
  quoteEl.hidden=!cur.quote; quoteEl.textContent=cur.quote?"“"+clip(cur.quote,500)+"”":"";
  status.textContent=""; turns=[]; thread.innerHTML=""; answer.hidden=true;
  panel.hidden=false; document.body.classList.add("asking");
  refreshLinks(); renderLog();
  setTimeout(function(){ qBox.focus(); },30);
}
function closeAsk(){
  if(ctl) ctl.abort();
  panel.hidden=true; document.body.classList.remove("asking");
  if(opener && opener.focus) opener.focus();
}

/* save each doubt in this browser */
function logDoubt(q,a){
  var log=load(LOGKEY,[]);
  log.unshift({w:cur.ctx.label,q:q,a:a||"",t:Date.now()});
  store(LOGKEY,log.slice(0,50)); renderLog();
}
function renderLog(){
  var log=load(LOGKEY,[]), ul=$(".ask-log ul");
  $(".ask-logn").textContent=log.length?"("+log.length+")":"";
  $(".ask-log").hidden=!log.length;
  ul.innerHTML=log.map(function(d,i){
    var when=new Date(d.t);
    return '<li><div class="ask-logw">'+esc(d.w)+' · '+when.toLocaleDateString()+'</div><div class="ask-logq">'+esc(d.q)+'</div>'+
      (d.a?'<details><summary>Answer</summary><div class="ask-md">'+md(d.a)+'</div></details>':'')+
      '<div class="ask-logb"><button type="button" class="linkish" data-again="'+i+'">Ask again</button><button type="button" class="linkish" data-del="'+i+'">Delete</button></div></li>';
  }).join("");
}

/* ---------- actions ---------- */
qBox.addEventListener("input",refreshLinks);
$(".ask-chips").addEventListener("click",function(e){
  var b=e.target.closest(".ask-chip"); if(!b) return;
  var v=qBox.value.trim(); qBox.value=v?(v+" "+b.textContent+"."):b.textContent+"."; qBox.focus(); refreshLinks();
});
$(".ask-widen").addEventListener("click",function(){ openAsk(ctxTopic(),null,opener); });
$(".ask-x").addEventListener("click",closeAsk);
document.addEventListener("keydown",function(e){ if(e.key==="Escape" && !panel.hidden) closeAsk(); });
function needQuestion(){ if(qBox.value.trim()) return false; status.textContent="Type your doubt first, or tap one of the quick prompts."; qBox.focus(); return true; }
openA.addEventListener("click",function(e){
  if(needQuestion()){ e.preventDefault(); return; }
  var full=buildPrompt(cur.ctx,cur.quote,qBox.value.trim(),false);
  copyText(full).then(function(ok){ status.textContent=ok?"Opening Claude. The doubt is also copied: paste it if the chat opens empty.":"Opening Claude. If the chat opens empty, use Copy and paste."; });
  logDoubt(qBox.value.trim());
});
projA.addEventListener("click",function(e){
  if(needQuestion()){ e.preventDefault(); return; }
  var full=buildPrompt(cur.ctx,cur.quote,qBox.value.trim(),false);
  copyText(full).then(function(ok){ status.textContent=ok?"Copied. In your project, start a chat and paste.":"Copy didn’t work here: use the Copy button, then paste in your project."; });
  logDoubt(qBox.value.trim());
});
$(".ask-copy").addEventListener("click",function(){
  if(needQuestion()) return;
  var full=buildPrompt(cur.ctx,cur.quote,qBox.value.trim(),false);
  copyText(full).then(function(ok){
    if(ok){ status.textContent="Copied. Paste it into any Claude chat."; }
    else { status.innerHTML="Copy is blocked here. Select the text below and copy it yourself."; var pre=el("textarea",{class:"ask-manual",rows:"6"}); pre.value=full; status.appendChild(pre); pre.select(); }
  });
});
$(".ask-projsave").addEventListener("click",function(){
  var v=$(".ask-projset input").value.trim();
  if(v && !/^https:\/\/claude\.ai\//.test(v)){ status.textContent="That doesn’t look like a claude.ai link. It should start with https://claude.ai/"; return; }
  store(PROJKEY,v); refreshLinks();
  status.textContent=v?"Saved. Use “Open in my project” to ask with your books.":"Project link removed.";
});
$(".ask-projset input").value=load(PROJKEY,"");
$(".ask-log").addEventListener("click",function(e){
  var a=e.target.closest("[data-again]"), d=e.target.closest("[data-del]"), log=load(LOGKEY,[]);
  if(a){ var it=log[Number(a.getAttribute("data-again"))]; if(it){ qBox.value=it.q; refreshLinks(); qBox.focus(); } }
  if(d){ log.splice(Number(d.getAttribute("data-del")),1); store(LOGKEY,log); renderLog(); }
});

/* ---------- answering inside the page (Claude-hosted version only) ---------- */
var CODES={not_granted:"Claude isn’t allowed to answer inside this page. Use Open in Claude instead.",sampling_disabled:"Claude can’t answer inside this page for this account. Use Open in Claude instead.",rate_limited:"Too many questions just now. Wait a little, or use Open in Claude.",session_expired:"Please sign in to Claude again.",refused:"Claude didn’t answer this one. Try rewording it.",prompt_too_large:"That was too long to send. Select less text."};
function hideHere(msg){ hereBtn.hidden=true; $(".ask-heretip").hidden=true; sample=null; if(msg) status.textContent=msg; }
function ask(content,isFollow){
  if(!sample) return;
  turns.push({role:"user",content:content});
  answer.hidden=false;
  if(isFollow){ thread.appendChild(el("div",{class:"ask-you"},esc(content))); }
  var bubble=el("div",{class:"ask-md ask-claude"},'<p class="muted">Thinking…</p>'); thread.appendChild(bubble);
  ctl=new AbortController(); stopBtn.hidden=false; hereBtn.disabled=true; $(".ask-send").disabled=true;
  sample(turns.slice(-12),{cache:false,signal:ctl.signal,onText:function(u){ bubble.innerHTML=md(u.text); }}).then(function(r){
    bubble.innerHTML=md(r.text); turns.push({role:"assistant",content:r.text});
    if(r.truncated) bubble.appendChild(el("p",{class:"muted"},"(Cut short. Ask for less at a time.)"));
    if(!isFollow) logDoubt(qBox.value.trim(),r.text);
  },function(e){
    turns.pop();
    if(e && e.text){ bubble.innerHTML=md(e.text); } else bubble.remove();
    var code=e&&e.code;
    if(code==="cancelled") return;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].indexOf(code)>-1) hideHere(CODES[code]||CODES.not_granted);
    else status.textContent=CODES[code]||"Something went wrong. Try again, or use Open in Claude.";
  }).then(function(){ stopBtn.hidden=true; hereBtn.disabled=false; $(".ask-send").disabled=false; ctl=null; });
}
hereBtn.addEventListener("click",function(){
  if(needQuestion()) return;
  status.textContent=""; turns=[]; thread.innerHTML="";
  ask(buildPrompt(cur.ctx,cur.quote,qBox.value.trim(),false),false);
});
$(".ask-send").addEventListener("click",function(){
  var ta=$(".ask-follow textarea"), v=ta.value.trim(); if(!v || !sample) return;
  ta.value=""; ask(v,true);
});
stopBtn.addEventListener("click",function(){ if(ctl) ctl.abort(); });
if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("sample").then(function(s){
    if(!s) return;
    sample=s; hereBtn.hidden=false; $(".ask-heretip").hidden=false;
  },function(){});
}

/* ---------- pointing: buttons, and selected text ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-ask]"); if(!b) return;
  var k=b.getAttribute("data-ask"), id=b.getAttribute("data-id");
  var ctx=k==="stop"?ctxStop(id):k==="skim"?ctxSkim(id):k==="reading"?ctxReading(id):k==="term"?ctxTerm(id):ctxTopic();
  openAsk(ctx,null,b);
});
var lastSel=null, appEl=document.getElementById("app");
document.addEventListener("selectionchange",function(){
  var s=window.getSelection(), txt=s?String(s).trim():"";
  if(txt.length>2 && s.anchorNode && appEl && appEl.contains(s.anchorNode)){
    lastSel={text:txt,node:s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement};
    fab.classList.add("sel"); fab.querySelector(".lab").textContent="Ask about the selected text";
  } else if(!txt){
    lastSel=null; fab.classList.remove("sel"); fab.querySelector(".lab").textContent="Ask a doubt";
  }
});
fab.addEventListener("pointerdown",function(e){ e.preventDefault(); });   /* keep the selection */
fab.addEventListener("click",function(){
  if(lastSel) openAsk(ctxFromNode(lastSel.node),lastSel.text,fab);
  else openAsk(ctxTopic(),null,fab);
});
window.SMMAsk={open:openAsk,ctxStop:ctxStop,ctxSkim:ctxSkim,buildPrompt:buildPrompt};
})();

</script>
</body>
</html>
